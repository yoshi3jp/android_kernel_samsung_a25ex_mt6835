name: KernelSU · SM-A166P One UI 6

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: "Kernel localversion suffix (e.g. 1.0.0)"
        required: false
        default: "dev"

permissions:
  contents: write

jobs:
  build:
    name: Build KernelSU — A166PXXS4AYC1
    runs-on: ubuntu-latest

    env:
      ARTIFACT_BASE: "KernelSU-SM-A166P-OneUI6-A166PXXS4AYC1"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            rsync curl bc bison flex libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
            python3 python3-pip zip tar

      - name: Generate release tag
        id: tag
        run: |
          TAG="r$(date -u +'%Y%m%d')-$(openssl rand -hex 4)"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Tag: ${TAG}"

      - name: Build kernel
        env:
          BUILD_KERNEL_VERSION: ${{ github.event.inputs.kernel_version || 'dev' }}
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Verify boot.img
        run: |
          [[ -f dist/boot.img ]] || { echo "::error::boot.img missing — build failed."; exit 1; }
          echo "boot.img size: $(du -sh dist/boot.img | cut -f1)"

      - name: Package boot.img (tar → zip)
        run: |
          NAME="${ARTIFACT_BASE}-${{ steps.tag.outputs.tag }}"
          tar -cvf "${NAME}.tar" -C dist boot.img
          zip "${NAME}.tar.zip" "${NAME}.tar"
          echo "ARCHIVE=${NAME}.tar.zip" >> "$GITHUB_ENV"
          echo "ARCHIVE_NAME=${NAME}"    >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: ${{ env.ARCHIVE }}
          retention-days: 30

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "KernelSU · SM-A166P · One UI 6 · A166PXXS4AYC1 [${{ steps.tag.outputs.tag }}]"
          body: |
            ## KernelSU Kernel — SM-A166P

            | Field     | Value                         |
            |-----------|-------------------------------|
            | Device    | Samsung Galaxy A16 (SM-A166P) |
            | Firmware  | A166PXXS4AYC1                 |
            | One UI    | 6 (Android 13)                |
            | Kernel    | 5.15                          |
            | Build tag | `${{ steps.tag.outputs.tag }}` |
            | Version   | `${{ github.event.inputs.kernel_version || 'dev' }}` |

            Flash `boot.img` (extracted from the archive) via `fastboot` or a custom recovery.

            > ⚠️ Automated build — flash at your own risk.
          files: ${{ env.ARCHIVE }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
