name: DroidSpaces · selectable device/firmware

on:
  workflow_dispatch:
    inputs:
      device_name:
        description: "Device name/model for artifact and release metadata, e.g. SM-A253Z or SCG33"
        required: true
        default: "SM-A253Z"
      firmware_version:
        description: "Firmware/build ID for artifact and release metadata, e.g. A253ZSCU1BZB5 or SCG33KDS1BZC2"
        required: true
        default: "A253ZSCS1BZA2"
      one_ui_version:
        description: "One UI major version, e.g. 8"
        required: true
        default: "8"
      android_version:
        description: "Android major version, e.g. 16"
        required: true
        default: "16"
      kernel_major:
        description: "Kernel version, e.g. 5.15"
        required: true
        default: "5.15"
      kernel_version:
        description: "Kernel localversion suffix, e.g. dev or 1.0.0"
        required: false
        default: "dev"

permissions:
  contents: write

jobs:
  build:
    name: Build DroidSpaces — ${{ inputs.device_name }} — ${{ inputs.firmware_version }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Prepare build metadata
        id: meta
        shell: bash
        env:
          DEVICE_NAME: ${{ inputs.device_name }}
          FIRMWARE_VERSION: ${{ inputs.firmware_version }}
          ONE_UI_VERSION: ${{ inputs.one_ui_version }}
          ANDROID_VERSION: ${{ inputs.android_version }}
          KERNEL_MAJOR: ${{ inputs.kernel_major }}
          BUILD_KERNEL_VERSION: ${{ inputs.kernel_version }}
        run: |
          set -euo pipefail

          sanitize() {
            printf '%s' "$1" | tr -c 'A-Za-z0-9._-' '-'
          }

          SAFE_DEVICE="$(sanitize "${DEVICE_NAME}")"
          SAFE_FIRMWARE="$(sanitize "${FIRMWARE_VERSION}")"
          SAFE_ONE_UI="$(sanitize "${ONE_UI_VERSION}")"
          SAFE_ANDROID="$(sanitize "${ANDROID_VERSION}")"
          SAFE_KERNEL="$(sanitize "${KERNEL_MAJOR}")"

          BUILD_ID="r$(date -u +'%Y%m%d')-$(openssl rand -hex 4)"
          ARTIFACT_BASE="DroidSpaces-${SAFE_DEVICE}-OneUI${SAFE_ONE_UI}-${SAFE_FIRMWARE}"
          RELEASE_TAG="${SAFE_FIRMWARE}-${BUILD_ID}"

          {
            echo "DEVICE_NAME=${DEVICE_NAME}"
            echo "FIRMWARE_VERSION=${FIRMWARE_VERSION}"
            echo "ONE_UI_VERSION=${ONE_UI_VERSION}"
            echo "ANDROID_VERSION=${ANDROID_VERSION}"
            echo "KERNEL_MAJOR=${KERNEL_MAJOR}"
            echo "BUILD_KERNEL_VERSION=${BUILD_KERNEL_VERSION:-dev}"
            echo "SAFE_DEVICE=${SAFE_DEVICE}"
            echo "SAFE_FIRMWARE=${SAFE_FIRMWARE}"
            echo "ARTIFACT_BASE=${ARTIFACT_BASE}"
            echo "RELEASE_TAG=${RELEASE_TAG}"
          } >> "$GITHUB_ENV"

          {
            echo "release_tag=${RELEASE_TAG}"
            echo "artifact_base=${ARTIFACT_BASE}"
          } >> "$GITHUB_OUTPUT"

          echo "Device: ${DEVICE_NAME}"
          echo "Firmware: ${FIRMWARE_VERSION}"
          echo "One UI: ${ONE_UI_VERSION} / Android ${ANDROID_VERSION}"
          echo "Kernel: ${KERNEL_MAJOR}"
          echo "Localversion suffix: ${BUILD_KERNEL_VERSION:-dev}"
          echo "Release tag: ${RELEASE_TAG}"

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            rsync curl bc bison flex libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
            python3 python3-pip zip tar

      - name: Build kernel
        env:
          BUILD_KERNEL_VERSION: ${{ env.BUILD_KERNEL_VERSION }}
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Verify boot.img
        run: |
          [[ -f dist/boot.img ]] || { echo "::error::boot.img missing — build failed."; exit 1; }
          echo "boot.img size: $(du -sh dist/boot.img | cut -f1)"

      - name: Package boot.img (tar → zip)
        run: |
          NAME="${ARTIFACT_BASE}-${RELEASE_TAG}"
          tar -cvf "${NAME}.tar" -C dist boot.img
          zip "${NAME}.tar.zip" "${NAME}.tar"
          echo "ARCHIVE=${NAME}.tar.zip" >> "$GITHUB_ENV"
          echo "ARCHIVE_NAME=${NAME}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: ${{ env.ARCHIVE }}
          retention-days: 30

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "DroidSpaces · ${{ env.DEVICE_NAME }} · One UI ${{ env.ONE_UI_VERSION }} · ${{ env.FIRMWARE_VERSION }} [${{ env.RELEASE_TAG }}]"
          body: |
            ## DroidSpaces Kernel — ${{ env.DEVICE_NAME }}

            | Field     | Value |
            |-----------|-------|
            | Device    | `${{ env.DEVICE_NAME }}` |
            | Firmware  | `${{ env.FIRMWARE_VERSION }}` |
            | One UI    | `${{ env.ONE_UI_VERSION }}` |
            | Android   | `${{ env.ANDROID_VERSION }}` |
            | Kernel    | `${{ env.KERNEL_MAJOR }}` |
            | Build tag | `${{ env.RELEASE_TAG }}` |
            | Version   | `${{ env.BUILD_KERNEL_VERSION }}` |

            Flash `boot.img` extracted from the archive via `fastboot` or a custom recovery.

            > ⚠️ Automated build — flash at your own risk.
          files: ${{ env.ARCHIVE }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
